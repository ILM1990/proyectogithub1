jobs:
  validate-prod:
    runs-on: self-hosted
    environment: production
    steps:
      - name: Validar entorno de producción
        shell: powershell
        env:
          TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TOKEN)) {
            Write-Host "CD: falta el secret PROD_TOKEN"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:LOCAL_PROD_TOKEN)) {
            Write-Host "CD: falta LOCAL_PROD_TOKEN en el runner"
            exit 1
          }
          if ($env:TOKEN -ceq $env:LOCAL_PROD_TOKEN) {
            Write-Host "CD: validación de producción correcta — listo para desplegar"
          } else {
            Write-Host "CD: validación fallida"
            exit 1
          }

  bump-version:
    needs: validate-prod
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      # ... step "Incrementar versión en el README" ...

      - name: Commit y push del README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "docs: bump de versión [skip ci]"
          git push
