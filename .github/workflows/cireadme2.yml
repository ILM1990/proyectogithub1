
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  changelog:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Añadir feature al README
        shell: bash
        env:
          FALLBACK_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          BRANCH=$(git log -1 --pretty=%B | grep 'Merge pull request' | sed -E 's#.*from [^/]+/##' || true)
          BRANCH=${BRANCH:-$FALLBACK_BRANCH}

          if [ "$BRANCH" = "main" ]; then
            echo "No es un merge de PR, no se añade nada."
            exit 0
          fi

          echo "- Añadida feature: $BRANCH" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: añadir feature $BRANCH [skip ci]"
          git push
