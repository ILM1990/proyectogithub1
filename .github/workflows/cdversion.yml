name: CD
on:
 pull_request:
 types: [opened, synchronize, reopened]
 branches: [main]
 push:
 branches: [main]
 workflow_dispatch: {}
permissions:
 contents: write
jobs:
 bump-version:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - name: Incrementar versión en el README
 run: |
 LAST=$(grep -oP 'AppVersion-\K[0-9]+' README.md | tail -1)
 NEXT=$((LAST + 1))
 FECHA=$(date '+%d/%m/%Y %H:%M')
 echo "- AppVersion-$NEXT - $FECHA" >> README.md
