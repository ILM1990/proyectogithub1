- name: Commit y push del README
 run: |
 git config user.name "github-actions[bot]"
 git config user.email "github-actions[bot]@users.noreply.github.com"
 git add README.md
 git commit -m "docs: bump de versión" || echo "Sin cambios que commitear"
 git push || echo "Nada que subir"
 validate-prod:
 needs: bump-version
 runs-on: self-hosted
 steps:
 - uses: actions/checkout@v4
 - name: Validar entorno de producción
 env:
 TOKEN: ${{ secrets.PROD_TOKEN }}
 run: |
 if ($env:TOKEN -eq $env:LOCAL_PROD_TOKEN) {
 Write-Host "CD: validación de producción correcta — listo para desplegar"
 } else {
 Write-Host "CD: validación fallida "
 exit 1
 }
