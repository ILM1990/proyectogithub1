name: CI
on:
 pull_request:
 types: [opened, synchronize, reopened]
 branches: [develop]
 push:
 branches: [develop]
 workflow_dispatch: {}
permissions:
 contents: write
jobs:
 update-readme:
 runs-on: ubuntu-latest
 steps:
 - uses: actions/checkout@v4
 - name: Registrar la rama en el README
 run: |
 BRANCH=$(git log -1 --pretty=%B | grep 'Merge pull request' | sed -E 's#.*from [^/]+/##')
 BRANCH=${BRANCH:-${{ github.head_ref || github.ref_name }}}
 echo "- Añadida feature: $BRANCH" >> README.md
