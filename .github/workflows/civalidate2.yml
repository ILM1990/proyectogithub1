permissions:
  contents: write

jobs:
  update-readme:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      # ... tu step que modifica README.md ...

      - name: Commit y push del README
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear"
            exit 0
          fi
          git commit -m "docs: registrar rama [skip ci]"
          git push

  validate-dev:
    needs: update-readme
    runs-on: self-hosted
    steps:
      - name: Validar entorno de desarrollo
        shell: powershell
        env:
          TOKEN: ${{ secrets.DEV_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:TOKEN)) {
            Write-Host "CI: falta el secret DEV_TOKEN"
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:LOCAL_DEV_TOKEN)) {
            Write-Host "CI: falta LOCAL_DEV_TOKEN en el runner"
            exit 1
          }
          if ($env:TOKEN -ceq $env:LOCAL_DEV_TOKEN) {
            Write-Host "CI: validación de desarrollo correcta"
          } else {
            Write-Host "CI: validación fallida"
            exit 1
          }
